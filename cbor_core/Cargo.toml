[package]
name = "cbor-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Pure-compute CBOR / MessagePack / COSE / CWT / WebAuthn structural decoders (ported verbatim from Query-farm vgi-cbor, no Arrow / no VGI deps)"

[dependencies]
ciborium = "0.2.2"
rmpv = "1.3.1"
serde_json = "1.0"
uuid = "1"
hex = "0.4"
base64 = "0.23"

[lints.rust]
unsafe_code = "forbid"
